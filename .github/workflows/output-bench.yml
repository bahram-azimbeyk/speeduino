name: Output bench checks

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stm32-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Host controller and INI checks
        run: |
          python tools/test_injector_bench.py
          python tools/test_bench_ini.py
          git diff --exit-code -- reference/levin-bench.ini
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: output-bench-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Build opt-in STM32 tester
        run: |
          python -m pip install platformio
          pio run -e levin_F407VE_bench
